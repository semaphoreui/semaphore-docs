<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="388" viewBox="0 0 1120 388" role="img" aria-label="Workflow editor keyboard shortcuts">
<rect x="0.5" y="0.5" width="1119" height="387" rx="14" fill="#fafafa" stroke="#e3e5e8"/>
<rect x="28" y="28" width="336" height="292" rx="12" fill="#ffffff" stroke="#e3e5e8"/>
<rect x="28" y="28" width="336" height="4" rx="2" fill="#1976d2"/>
<text x="46" y="62" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827" letter-spacing="0.04em">NAVIGATE</text>
<rect x="46" y="85" width="31" height="30" rx="6" fill="#d5d8dd"/><rect x="46" y="82" width="31" height="30" rx="6" fill="#ffffff" stroke="#c3c7cd"/><text x="61.5" y="101.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">←</text><text x="87" y="101.5" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280">/</text><rect x="99" y="85" width="31" height="30" rx="6" fill="#d5d8dd"/><rect x="99" y="82" width="31" height="30" rx="6" fill="#ffffff" stroke="#c3c7cd"/><text x="114.5" y="101.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">→</text><text x="140" y="101.5" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280">/</text><rect x="152" y="85" width="31" height="30" rx="6" fill="#d5d8dd"/><rect x="152" y="82" width="31" height="30" rx="6" fill="#ffffff" stroke="#c3c7cd"/><text x="167.5" y="101.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">↑</text><text x="193" y="101.5" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280">/</text><rect x="205" y="85" width="31" height="30" rx="6" fill="#d5d8dd"/><rect x="205" y="82" width="31" height="30" rx="6" fill="#ffffff" stroke="#c3c7cd"/><text x="220.5" y="101.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">↓</text>
<text x="346" y="101.5" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#374151">Pan the canvas</text>
<rect x="46" y="131" width="60" height="30" rx="6" fill="#d5d8dd"/><rect x="46" y="128" width="60" height="30" rx="6" fill="#ffffff" stroke="#c3c7cd"/><text x="76.0" y="147.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Shift</text><text x="114" y="147.5" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280">+</text><rect x="126" y="131" width="64" height="30" rx="6" fill="#d5d8dd"/><rect x="126" y="128" width="64" height="30" rx="6" fill="#ffffff" stroke="#c3c7cd"/><text x="158.0" y="147.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">←→↑↓</text>
<text x="346" y="147.5" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#374151">Pan in larger steps</text>
<rect x="46" y="177" width="44" height="30" rx="6" fill="#d5d8dd"/><rect x="46" y="174" width="44" height="30" rx="6" fill="#ffffff" stroke="#c3c7cd"/><text x="68.0" y="193.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Tab</text>
<text x="346" y="193.5" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#374151">Focus the next node</text>
<rect x="46" y="223" width="60" height="30" rx="6" fill="#d5d8dd"/><rect x="46" y="220" width="60" height="30" rx="6" fill="#ffffff" stroke="#c3c7cd"/><text x="76.0" y="239.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Enter</text>
<text x="346" y="239.5" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#374151">Open the focused node</text>
<rect x="46" y="269" width="44" height="30" rx="6" fill="#d5d8dd"/><rect x="46" y="266" width="44" height="30" rx="6" fill="#ffffff" stroke="#c3c7cd"/><text x="68.0" y="285.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Esc</text>
<text x="346" y="285.5" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#374151">Deselect / close panel</text>
<rect x="392" y="28" width="336" height="292" rx="12" fill="#ffffff" stroke="#e3e5e8"/>
<rect x="392" y="28" width="336" height="4" rx="2" fill="#00897b"/>
<text x="410" y="62" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827" letter-spacing="0.04em">ZOOM</text>
<rect x="410" y="85" width="31" height="30" rx="6" fill="#d5d8dd"/><rect x="410" y="82" width="31" height="30" rx="6" fill="#ffffff" stroke="#c3c7cd"/><text x="425.5" y="101.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">+</text><text x="451" y="101.5" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280">/</text><rect x="463" y="85" width="31" height="30" rx="6" fill="#d5d8dd"/><rect x="463" y="82" width="31" height="30" rx="6" fill="#ffffff" stroke="#c3c7cd"/><text x="478.5" y="101.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">−</text>
<text x="710" y="101.5" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#374151">Zoom in / out</text>
<rect x="410" y="131" width="30" height="30" rx="6" fill="#d5d8dd"/><rect x="410" y="128" width="30" height="30" rx="6" fill="#ffffff" stroke="#c3c7cd"/><text x="425.0" y="147.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">0</text>
<text x="710" y="147.5" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#374151">Fit the whole graph</text>
<rect x="410" y="177" width="30" height="30" rx="6" fill="#d5d8dd"/><rect x="410" y="174" width="30" height="30" rx="6" fill="#ffffff" stroke="#c3c7cd"/><text x="425.0" y="193.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">1</text>
<text x="710" y="193.5" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#374151">Reset zoom to 100 %</text>
<rect x="410" y="223" width="52" height="30" rx="6" fill="#d5d8dd"/><rect x="410" y="220" width="52" height="30" rx="6" fill="#ffffff" stroke="#c3c7cd"/><text x="436.0" y="239.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Ctrl</text><text x="470" y="239.5" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280">+</text><rect x="482" y="223" width="60" height="30" rx="6" fill="#d5d8dd"/><rect x="482" y="220" width="60" height="30" rx="6" fill="#ffffff" stroke="#c3c7cd"/><text x="512.0" y="239.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">wheel</text>
<text x="710" y="239.5" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#374151">Zoom towards the pointer</text>
<rect x="410" y="269" width="60" height="30" rx="6" fill="#d5d8dd"/><rect x="410" y="266" width="60" height="30" rx="6" fill="#ffffff" stroke="#c3c7cd"/><text x="440.0" y="285.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">wheel</text>
<text x="710" y="285.5" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#374151">Pan with the wheel / trackpad</text>
<rect x="756" y="28" width="336" height="292" rx="12" fill="#ffffff" stroke="#e3e5e8"/>
<rect x="756" y="28" width="336" height="4" rx="2" fill="#ab47bc"/>
<text x="774" y="62" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827" letter-spacing="0.04em">EDIT</text>
<rect x="774" y="85" width="68" height="30" rx="6" fill="#d5d8dd"/><rect x="774" y="82" width="68" height="30" rx="6" fill="#ffffff" stroke="#c3c7cd"/><text x="808.0" y="101.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Delete</text>
<text x="1074" y="101.5" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#374151">Delete selected node or edge</text>
<rect x="774" y="131" width="52" height="30" rx="6" fill="#d5d8dd"/><rect x="774" y="128" width="52" height="30" rx="6" fill="#ffffff" stroke="#c3c7cd"/><text x="800.0" y="147.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Ctrl</text><text x="834" y="147.5" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280">+</text><rect x="846" y="131" width="30" height="30" rx="6" fill="#d5d8dd"/><rect x="846" y="128" width="30" height="30" rx="6" fill="#ffffff" stroke="#c3c7cd"/><text x="861.0" y="147.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Z</text>
<text x="1074" y="147.5" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#374151">Undo (up to 50 steps)</text>
<rect x="774" y="177" width="52" height="30" rx="6" fill="#d5d8dd"/><rect x="774" y="174" width="52" height="30" rx="6" fill="#ffffff" stroke="#c3c7cd"/><text x="800.0" y="193.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Ctrl</text><text x="834" y="193.5" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280">+</text><rect x="846" y="177" width="60" height="30" rx="6" fill="#d5d8dd"/><rect x="846" y="174" width="60" height="30" rx="6" fill="#ffffff" stroke="#c3c7cd"/><text x="876.0" y="193.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Shift</text><text x="914" y="193.5" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280">+</text><rect x="926" y="177" width="30" height="30" rx="6" fill="#d5d8dd"/><rect x="926" y="174" width="30" height="30" rx="6" fill="#ffffff" stroke="#c3c7cd"/><text x="941.0" y="193.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Z</text>
<text x="1074" y="193.5" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#374151">Redo</text>
<rect x="774" y="223" width="52" height="30" rx="6" fill="#d5d8dd"/><rect x="774" y="220" width="52" height="30" rx="6" fill="#ffffff" stroke="#c3c7cd"/><text x="800.0" y="239.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Ctrl</text><text x="834" y="239.5" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280">+</text><rect x="846" y="223" width="30" height="30" rx="6" fill="#d5d8dd"/><rect x="846" y="220" width="30" height="30" rx="6" fill="#ffffff" stroke="#c3c7cd"/><text x="861.0" y="239.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Y</text>
<text x="1074" y="239.5" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#374151">Redo (alternative)</text>
<rect x="774" y="269" width="108" height="30" rx="6" fill="#d5d8dd"/><rect x="774" y="266" width="108" height="30" rx="6" fill="#ffffff" stroke="#c3c7cd"/><text x="828.0" y="285.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Right-click</text>
<text x="1074" y="285.5" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#374151">Add a node at the pointer</text>
<text x="28" y="356" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b7280">On macOS use Cmd instead of Ctrl. Shortcuts work while the canvas has focus: click empty canvas first.</text>
</svg>