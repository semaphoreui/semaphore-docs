# Vale configuration for the Semaphore UI documentation.
# https://vale.sh/docs/topics/config/
#
# Run locally:   vale docs/
# Sync styles:   vale sync
#
# The rule set is deliberately small to start with: Vale's built-in checks catch
# real defects (repeated words, unmatched quotes, misspellings) without flooding
# 100+ existing pages with style warnings. Add a stricter package (Google,
# Microsoft) once the back catalogue has been reviewed.

StylesPath = styles

MinAlertLevel = error

Vocab = Semaphore

[*.md]
BasedOnStyles = Vale

# Product and UI names are written as they appear in the interface.
Vale.Terms = NO

# Front matter is metadata, not prose.
TokenIgnores = (?s)^---\n.*?\n---\n

# Do not lint code, inline code, link targets, JSX tags, or image paths.
BlockIgnores = (?s) *(<[A-Z][A-Za-z]* ?[^>]*/>)
